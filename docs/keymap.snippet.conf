# dicta — add these lines to ~/.config/agterm/keymap.conf, then `agtermctl keymap reload`.
#
# Absolute paths on purpose: a custom command runs through `/bin/sh -c`, and routing it via a login
# shell would add tens of milliseconds of profile loading to every keypress. Measured warm cost of
# one of these lines, end to end, is 20–70 ms.
#
# `$AGT_SESSION_ID` is what pins the target. The pane is deliberately NOT passed: the installed
# agterm build does not export `$AGT_PANE` to custom commands, and the daemon resolves the focused
# pane itself from `agtermctl tree --json` — which is the better source anyway, because it reads
# live focus rather than what the keymap runner happened to capture.
#
# `toggle` — not `start`/`stop`. Start-or-stop is decided inside the daemon, atomically. Writing it
# in the shell as `status | grep idle && start || stop` takes two round trips with a window between
# them, in which the duration cap can fire or a second chord can land, so one keypress could both
# start and stop.
#
# The mode is chosen by WHICH CHORD STOPS the recording, so both start bindings are identical and
# nothing has to be decided before you start speaking.

command "Dicta: диктовка (обработанный текст)"  ctrl+opt+d        "$HOME/.local/bin/dictactl" toggle --mode clean --session "$AGT_SESSION_ID" --socket "$AGT_SOCKET"
command "Dicta: диктовка (сырой текст)"         ctrl+opt+shift+d  "$HOME/.local/bin/dictactl" toggle --mode raw   --session "$AGT_SESSION_ID" --socket "$AGT_SOCKET"
command "Dicta: отменить диктовку"              ctrl+opt+x        "$HOME/.local/bin/dictactl" abort
