# dicta — add these three lines to ~/.config/agterm/keymap.conf, then `agtermctl keymap reload`.
#
# The last three lines of this file are the snippet; everything above is why they read the way they
# do. A test parses them with the same `ClientCommand` parser dictactl uses, so this file cannot
# quietly stop matching the build.
#
# Absolute path on purpose. agterm runs a custom command through `/bin/sh -c`, so a bare `dictactl`
# would cost a PATH search on every keypress and would break entirely if the keymap runner's PATH
# differs from the user's; routing it through a login shell instead would add tens of milliseconds
# of profile loading to every keypress (§12). Measured warm cost of one of these lines, end to end,
# is 20-70 ms against a 150 ms budget (F4).
#
# `$AGT_SESSION_ID` is what pins the target. The pane is deliberately NOT passed: the installed
# agterm build does not export `$AGT_PANE` to custom commands (F3), and the daemon resolves the
# focused pane itself from `agtermctl tree --json` — which is the better source anyway, because it
# reads live focus rather than what the keymap runner happened to capture (D6, §5).
#
# `$AGT_SOCKET` names the agterm instance the chord was pressed in, so injection and notifications
# reach that one rather than whichever instance answers the default socket first.
#
# `toggle` — not `start`/`stop`. Start-or-stop is decided inside the daemon, atomically. Writing it
# in the shell as `status | grep idle && start || stop` takes two round trips with a window between
# them in which the duration cap can fire or a second chord can land, so one keypress could both
# start and stop (D7).
#
# The mode is chosen by WHICH CHORD STOPS the recording, so both start bindings are identical and
# nothing has to be decided before you start speaking (D3, D5). That is why the two lines below
# differ in exactly one thing: --mode.
#
# ctrl+opt+x carries no session: aborting needs no target, only an attempt to abandon.

command "Dicta: dictate (clean)"  ctrl+opt+d        $HOME/.local/bin/dictactl toggle --mode clean --session "$AGT_SESSION_ID" --socket "$AGT_SOCKET"
command "Dicta: dictate (raw)"    ctrl+opt+shift+d  $HOME/.local/bin/dictactl toggle --mode raw --session "$AGT_SESSION_ID" --socket "$AGT_SOCKET"
command "Dicta: abort"            ctrl+opt+x        $HOME/.local/bin/dictactl abort --socket "$AGT_SOCKET"
