# dicta — the Tier 0 replacement dictionary (D9a)
#
# Copy this file to ~/Library/Application Support/dev.personal.dicta/replacements.conf and edit it.
# dicta re-reads it before every dictation, so an edit takes effect on the next chord: no restart.
#
# WHY IT EXISTS. Parakeet recognises Russian well, and it transliterates English technical terms
# spoken inside Russian into Cyrillic — say "FluidAudio" in a Russian sentence and the text comes
# back spelled phonetically, in Cyrillic letters. That is measured, not assumed (AGENTS.md, Task 10),
# and undoing it is the whole job of this file. It is not a spell-checker and not a style pass.
#
# ─── the format ─────────────────────────────────────────────────────────────────────────────────
#
#     <id> | <pattern> | <replacement>
#
#   • The **id** is yours and it never changes on its own. It is what dicta writes into the record's
#     `rules` field, so a rule you added months ago is still identifiable by name. Give it something
#     you will recognise. No spaces in it.
#   • The **pattern** is literal text, not a regular expression. It is matched case-insensitively.
#   • The **replacement** is inserted exactly as written here — no capitalisation matching, because
#     the point of a rule is one canonical spelling. It may be empty, which deletes the pattern.
#     Everything after the second bar is the replacement, bars included.
#   • A line starting with `#` is a comment. Comments are whole lines; a `#` inside a rule is text.
#   • Spaces around each field are trimmed.
#
# ─── how the rules run ──────────────────────────────────────────────────────────────────────────
#
#   • **Top to bottom, each rule over the previous one's result.** A later rule sees what an earlier
#     one produced. Put the specific rules above the general ones.
#   • **Word boundaries are respected.** A rule for `свифт` fires on "свифт" and not inside
#     "свифтом" — and Russian inflects nearly everything, so an ending needs its own rule. There is
#     a pair below showing exactly that. The boundary is only required on a side where the pattern's
#     own edge is a letter or a digit: a pattern ending in `.` or `+` imposes no condition after it.
#   • **A broken line costs only itself.** dicta skips it, applies every other rule, notifies you
#     once that the dictionary is degraded, and delivers the text. A config file never costs you a
#     dictation.
#   • **A rule that empties your text is refused, loudly.** Nothing is typed and the notification
#     says the dictionary did it, so you are not left looking at your microphone.
#
# ─── when a rule misfires ───────────────────────────────────────────────────────────────────────
#
# Every attempt leaves one line in ~/Library/Application Support/dev.personal.dicta/record.jsonl.
# `recognised` is what the recogniser said, verbatim; `final` is what was typed; `rules` lists the
# ids that fired. Those three name the offending rule without re-running anything:
#
#     dictactl last --recognised     # what you actually said
#     dictactl last                  # what dicta typed
#     tail -1 ~/Library/Application\ Support/dev.personal.dicta/record.jsonl | jq .rules
#
# The rule at the bottom of this file is deliberately wrong, and commented out. Uncomment it, dictate
# one sentence containing the Russian word for "code", and the three fields above will point at it.
#
# ─── the check lines ────────────────────────────────────────────────────────────────────────────
#
# Lines beginning `# check |` are comments to the parser and assertions to the test suite:
#
#     # check | <what the recogniser said> | <what this file must turn it into>
#
# `ReplacementsTests` runs every one of them through the whole book, in file order, and fails when
# the result differs. They exist because the cascade has a failure mode reading cannot catch: a rule
# above eats the text a rule below was written for, and the file still looks correct. The sentences
# in them are invented for this file: they show the rules working, and they quote nobody.

# ─── names, restored to the way they are written ────────────────────────────────────────────────
#
# A NAME goes back to its canonical Latin spelling. An ordinary borrowed noun that is inflected in
# Russian is left alone: every case ending would need a rule of its own to read any better.

dicta        | дикта              | dicta
agterm       | агтерм             | agterm
dictactl     | диктактл           | dictactl
# `claude` sits above `claude-bare` for the reason the `package`/`swift` pair below spells out: the
# shorter pattern is a prefix of the longer phrase, so the general rule first would leave
# "Claude код" and a dead rule underneath it.
claude       | клод код           | Claude Code
claude-bare  | клод               | Claude
# check | клод код прочитал файл | Claude Code прочитал файл
# `package` sits above `swift` because it CONTAINS it. The rules cascade, so `swift` running first
# turns "пакет свифт" into "пакет Swift" and leaves `package` searching for a phrase that no longer
# exists — a rule you can read in the file that never fires, and a record whose `rules` names the
# wrong one. That is the "specific above general" line at the top of this file, in the one place
# this file could get it wrong.
package      | пакет свифт        | Package.swift
swift        | свифт              | Swift
swift-decl   | свифтом            | Swift
# check | добавь зависимость в пакет свифт | добавь зависимость в Package.swift
# check | модуль написан на свифт | модуль написан на Swift
fluidaudio   | флюид аудио        | FluidAudio
parakeet     | паракит            | Parakeet
coreml       | кор эмэл           | CoreML
launchagent  | лаунч агент        | LaunchAgent
# check | флюид аудио скачивает модель паракит | FluidAudio скачивает модель Parakeet
github       | гитхаб             | GitHub
gitlab       | гитлаб             | GitLab
docker       | докер              | Docker
# check | открой issue на гитхаб | открой issue на GitHub
# check | образ собирается в докер | образ собирается в Docker

# ─── the merge request, in two passes ───────────────────────────────────────────────────────────
#
# A recogniser garbles the first word of a term like this one, splits the pair where it likes, and
# puts a Russian case ending on whichever half it lands on. Writing out every pair does not
# converge: each new garble would need one line per ending.
#
# So the first word is repaired on its own, and the pair is matched afterwards. A garble that turns
# up tomorrow is one line in pass 1 rather than one line per ending.
#
# Pass 1 -- put the first word back. Every pattern here is a string that is no Russian word at all.
mr-yo        | мёрж               | мерж
mr-zhi       | мержи              | мерж
mr-shi       | мерши              | мерж
mr-dzh       | мердж              | мерж
# Pass 2 -- the pair, with whatever ending the second word arrived with. The boundary rule is what
# makes these safe to list flat: `мерж квест` cannot fire inside `мерж квестов`, so no rule here
# eats another's sentence and the order between them does not matter.
mr-0         | мерж квест         | merge request
mr-1         | мерж квеста        | merge request
mr-6         | мерж квестов       | merge request
mr-7         | мерж реквест       | merge request
mr-8         | мерж реквеста      | merge request
mr-10        | мерж реквесте      | merge request
mr-11        | мерж реквестом     | merge request
# The abbreviation. The boundary rule is the only reason a two-letter pattern is safe: it keeps the
# pattern out of every longer word.
mr-abbr      | мр                 | MR
# check | открой мержи квест | открой merge request
# check | оставь комментарий в мердж реквесте | оставь комментарий в merge request
# check | этим мр мы чиним тесты | этим MR мы чиним тесты

# ─── repairs: what was misheard, put back into Russian ──────────────────────────────────────────
#
# These do not restore a name. They undo a mishearing and leave the word where the grammar put it.
# Each pattern is a string that is not a Russian word at all — that is the test a repair has to
# pass before it is written down, because a rule on a real word is a `misfire` waiting for a
# sentence. Three endings of one word, because Russian inflects and the matching is literal; the
# bare `комит` cannot fire inside `комитом`, which is the boundary rule working rather than a gap.
commit-nom   | комит              | коммит
commit-ins   | комитом            | коммитом
commit-heard | закамичу           | закоммичу
# check | у нас пока один комит | у нас пока один коммит
# check | закамичу и открою мерж реквест | закоммичу и открою merge request

# `флот` is an ordinary Russian word, a naval fleet, so "float" heard as it gets rules on PHRASES
# and never on the bare word. The bare word is what `misfire` looks like.
float-nom    | флот значения      | float значения
float-gen    | флот значений      | float значений
# check | округли флот значения | округли float значения

# ─── abbreviations, spelled out loud ────────────────────────────────────────────────────────────
#
# `веб юай` sits above `юай` because a phrase has to beat the word it contains.
api          | апи                | API
ui-web       | веб юай            | web UI
ui           | юай                | UI
sdk          | сдк                | SDK
ci           | сиай               | CI
ssh          | ссэйч              | SSH
http         | айчтип             | HTTP
pdf          | пдф                | PDF
readme       | редми              | README
e2e-and      | энд ту энд         | end-to-end
# check | проверь что отвечает апи | проверь что отвечает API
# check | поправь отступы в веб юай | поправь отступы в web UI
# check | запусти энд ту энд тесты | запусти end-to-end тесты
# check | проверь не только редми но и код | проверь не только README но и код

# What this file cannot do, named so it is not rediscovered:
#
#   • A garble that is an ordinary Russian word gets no rule of its own -- the `флот` phrases above
#     are the shape a fix takes instead, and when no phrase is safe the miss stays a miss.
#   • A garble that comes back in pure Latin ("n-to-end" for "end-to-end") cannot get a rule at
#     all: the suite requires Cyrillic in every pattern with letters in it, because Tier 0 exists to
#     undo transliteration and a file drifting into general spell-checking would have no edge left.

# ─── version numbers, spoken as words ──────────────────────────────────────────────────────────
#
# A version dictated as words, "три точка два точка один", leaves an agent guessing at the string
# it is supposed to match. Thirty rules turn it into 3.2.1.
#
# They work in three passes, and the passes are the whole trick -- a literal rule cannot join two
# words across a space unless its pattern CONTAINS both of them, and a pattern may not begin with
# a space (the fields are trimmed). So the join is done from the left, one component at a time,
# each pass eating the space the previous one left behind:
#
#     три точка два точка один
#     три .2 .1         <- pass 1, `точка <word>` becomes `.<digit>`
#     3.2 .1            <- pass 2, `<word> .` becomes `<digit>.`
#     3.2.1             <- pass 3, the same join once the left side is already a digit
#
# Pass 3 is the one place in this file where a pattern carries no Cyrillic, because by then there
# is none left to carry: `2 .` is the whole of it. The test that requires Cyrillic makes room for
# exactly this shape -- no letters at all -- and for nothing else, so the file still cannot drift
# into spell-checking English.
#
# What they deliberately do NOT do is turn number words into digits anywhere else. `два` on its
# own stays `два`: "осталось два варианта" is prose, and only a `точка` between two numbers says
# a version is being spelled out.
#
# The known edge: pass 1 fires on `точка <number>` even when nothing to its left can absorb the
# result, which is what a misspoken version does -- "один точка пять, точка четыре" comes out
# "1.5, .4". Both halves are still readable, and the alternative is 200 rules that spell out every
# pair.
num-dot-0    | точка ноль         | .0
num-dot-1    | точка один         | .1
num-dot-2    | точка два          | .2
num-dot-3    | точка три          | .3
num-dot-4    | точка четыре       | .4
num-dot-5    | точка пять         | .5
num-dot-6    | точка шесть        | .6
num-dot-7    | точка семь         | .7
num-dot-8    | точка восемь       | .8
num-dot-9    | точка девять       | .9
num-head-0   | ноль .             | 0.
num-head-1   | один .             | 1.
num-head-2   | два .              | 2.
num-head-3   | три .              | 3.
num-head-4   | четыре .           | 4.
num-head-5   | пять .             | 5.
num-head-6   | шесть .            | 6.
num-head-7   | семь .             | 7.
num-head-8   | восемь .           | 8.
num-head-9   | девять .           | 9.
num-join-0   | 0 .                | 0.
num-join-1   | 1 .                | 1.
num-join-2   | 2 .                | 2.
num-join-3   | 3 .                | 3.
num-join-4   | 4 .                | 4.
num-join-5   | 5 .                | 5.
num-join-6   | 6 .                | 6.
num-join-7   | 7 .                | 7.
num-join-8   | 8 .                | 8.
num-join-9   | 9 .                | 9.
# check | версия три точка два точка один | версия 3.2.1
# check | обнови до четыре точка ноль точка ноль | обнови до 4.0.0
# check | осталось два варианта | осталось два варианта

# ─── not yet observed: guesses, and they are marked as guesses ──────────────────────────────────
#
# Everything above shows a rule this file needs in order to demonstrate something. Everything below
# is a prediction of how the recogniser will mangle a word, and predictions about transliteration
# are wrong about as often as they are right. A guess that never fires costs nothing and is
# invisible; a guess that fires on the WRONG text is a `misfire`, so the same rule applies here as
# above — no pattern that is also an ordinary Russian word. When one of these turns out to be
# wrong, the record says so: `rules` names what fired, `recognised` shows what it should have been.

kubernetes   | кубернетес         | Kubernetes
grafana      | графана            | Grafana
postgres     | постгрес           | Postgres

# ─── the deliberate misfire, for the workflow above ─────────────────────────────────────────────
#
# `код` is an ordinary Russian word said constantly, so this rule fires where it has no business
# firing. Uncomment the next line, dictate one sentence with that word in it, and read
# `recognised`, `final` and `rules` back out of the record — the id below is what they will name.
#misfire     | код                | Claude Code
